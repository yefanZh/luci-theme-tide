<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f6fb">
  <title>澜 TIDE · 明暗主题确认原型</title>
  <link rel="stylesheet" href="tide-theme.css">
</head>
<body class="theme-tide" data-selected="tide">
  <a class="skip" href="#content">跳到主要内容</a>
  <div class="labbar">
    <div class="labbrand"><span class="labmark" aria-hidden="true"></span><strong>澜 TIDE / 明暗主题</strong><a class="labdesc" href="index.html">查看原始三套方案</a></div>
    <div class="theme-picker" role="group" aria-label="选择明暗模式">
      <button data-appearance="light" aria-pressed="true"><i class="swatch tide"></i><span>浅色</span></button>
      <button data-appearance="dark" aria-pressed="false"><i class="swatch noct"></i><span>深色</span></button>
      <button data-appearance="auto" aria-pressed="false"><span>跟随系统</span></button>
    </div>
    <button class="lab-motion" id="motionToggle" aria-pressed="true" title="暂停或播放动态效果"><span class="motion-dot"></span><span>动效开启</span></button>
  </div>
  <div id="app"></div>
  <div class="loadline" aria-hidden="true"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <dialog id="deviceDialog" aria-labelledby="deviceTitle"></dialog>
  <script src="app.js"></script>
</body>
</html>
